<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wolf_Warrior's Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Segoe UI,sans-serif;
background:#0d1117;
color:#fff;
text-align:center;
min-height:100vh;
overflow-x:hidden
}
body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(0,123,255,.15),transparent 350px),
radial-gradient(circle at 80% 80%,rgba(211,47,47,.15),transparent 350px);
z-index:-1
}
header{
background:linear-gradient(135deg,#0056b3,#d32f2f);
padding:28px 15px;
box-shadow:0 4px 20px rgba(0,0,0,.4)
}
h1{
font-size:2rem;
letter-spacing:2px;
text-transform:uppercase
}
.hero{
margin:30px 20px
}
.hero p{
color:#c9d1d9;
font-size:.95rem
}
.games{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:16px;
padding:20px
}
.card{
width:190px;
height:125px;
background:#161b22;
border:1px solid #30363d;
border-radius:16px;
text-decoration:none;
color:#fff;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.25s;
box-shadow:0 0 12px rgba(0,0,0,.2)
}
.card:hover{
transform:translateY(-5px);
border-color:#58a6ff;
box-shadow:0 0 22px rgba(88,166,255,.25)
}
.icon{
font-size:.65rem;
margin-bottom:6px;
transition:.25s
}
.card h3{
font-size:.95rem;
font-weight:600;
transition:.25s
}
.card:hover .icon{
transform:scale(1.2)
}
.card:hover h3{
transform:scale(1.05)
}
footer{
margin-top:40px;
padding:20px;
color:#8b949e;
border-top:1px solid #21262d
}
@media(max-width:600px){
.card{
width:165px;
height:110px
}
}
</style>
</head>
<body>
<header>
<h1>Wolf_Warrior's Games</h1>
</header><section class="hero">
<p>Play free browser games.</p>
</section><section class="games">
<a href="https://kacperjakfat8-maker.github.io/Citrus-Conglomerate/" target="_blank" class="card">
<div class="icon">🍋</div>
<h3>Citrus Conglomerate</h3>
</a><a href="https://kacperjakfat8-maker.github.io/Coffee-Tycoon/" target="_blank" class="card">
<div class="icon">☕</div>
<h3>Coffee Tycoon</h3>
</a>
</section><footer>
© <span id="year"></span> xxWolf_Warriorxx
</footer><script>
document.getElementById("year").textContent=new Date().getFullYear();
</script></body>
</html>
